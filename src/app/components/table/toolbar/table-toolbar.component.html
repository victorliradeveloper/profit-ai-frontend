<div class="flex items-center justify-between gap-4" [ngClass]="containerClass" role="toolbar" [attr.aria-label]="ariaLabel">
  <div class="flex items-center gap-3 min-w-0">
    <div *ngIf="title" class="min-w-0">
      <div class="text-white font-semibold leading-tight truncate">{{ title }}</div>
      <div *ngIf="subtitle" class="text-white/70 text-sm leading-tight truncate">{{ subtitle }}</div>
    </div>
    <ng-content select="[toolbar-left]"></ng-content>
  </div>

  <div class="flex items-center gap-2">
    <ng-content select="[toolbar-right]"></ng-content>
  </div>
</div>
