<div class="rounded-2xl overflow-hidden bg-[#2c2c2e] border border-white/10">
  <div class="overflow-x-auto">
    <ng-container *ngIf="loading; else notLoading">
      <div class="py-12 px-6 flex items-center justify-center">
        <div class="flex items-center gap-3 text-white/80">
          <span class="inline-block w-5 h-5 rounded-full border-2 border-white/30 border-t-white/80 animate-spin"></span>
          <span>Carregando...</span>
        </div>
      </div>
    </ng-container>

    <ng-template #notLoading>
      <ng-container *ngIf="error; else noError">
        <div class="py-12 px-6 flex items-center justify-center">
          <div class="text-center max-w-md">
            <div class="text-white font-semibold mb-1">{{ errorText }}</div>
            <div class="text-white/70 text-sm" *ngIf="error">{{ error }}</div>
          </div>
        </div>
      </ng-container>

      <ng-template #noError>
        <ng-container *ngIf="showNoResultsState; else maybeEmpty">
          <div class="py-12 px-6 flex items-center justify-center">
            <div class="text-center max-w-md">
              <div class="text-white font-semibold mb-1">Sem resultados</div>
              <div class="text-white/70 text-sm">{{ noResultsText }}</div>
            </div>
          </div>
        </ng-container>

        <ng-template #maybeEmpty>
          <ng-container *ngIf="showEmptyState; else showData">
            <div class="py-12 px-6 flex items-center justify-center">
              <div class="text-center max-w-md">
                <div class="text-white font-semibold mb-1">Sem dados</div>
                <div class="text-white/70 text-sm">{{ emptyText }}</div>
              </div>
            </div>
          </ng-container>

          <ng-template #showData>
            <table
              mat-table
              [dataSource]="dataSource"
              matSort
              class="w-full !bg-transparent table-fixed"
              [attr.aria-label]="ariaLabel"
            >
              <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
                <th
                  mat-header-cell
                  *matHeaderCellDef
                  [mat-sort-header]="col.key"
                  [disabled]="col.sortable === false"
                  class="!text-white/80 !font-semibold !bg-transparent relative pr-4 !py-2"
                  [ngClass]="headerAlignClass(col)"
                >
                  <span>{{ col.header }}</span>
                  <span
                    *ngIf="col.resizable"
                    [appColumnResize]="col.key"
                    class="absolute right-0 top-0 h-full w-4 cursor-col-resize"
                    aria-hidden="true"
                  >
                    <span class="absolute right-1 top-1/2 -translate-y-1/2 h-6 w-px bg-white/20 opacity-60 hover:opacity-100"></span>
                  </span>
                </th>

                <td
                  mat-cell
                  *matCellDef="let row"
                  class="!bg-transparent !border-b !border-white/10 !py-5"
                  [ngClass]="headerAlignClass(col)"
                >
                  <ng-container *ngIf="getCellTemplate(col.key) as tpl; else defaultCell">
                    <ng-container *ngTemplateOutlet="tpl; context: { $implicit: row }"></ng-container>
                  </ng-container>
                  <ng-template #defaultCell>
                    <span class="!text-white/80">{{ getValue(row, col.key) }}</span>
                  </ng-template>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns" class="!bg-white/5"></tr>
              <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns"
                class="!border-b !border-white/10 hover:!bg-white/5"
              ></tr>
            </table>
          </ng-template>
        </ng-template>
      </ng-template>
    </ng-template>
  </div>

  <div class="border-t border-white/10" *ngIf="showTable">
    <mat-paginator
      class="!bg-[#2c2c2e]"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      [attr.aria-label]="paginatorAriaLabel"
    ></mat-paginator>
  </div>
</div>
