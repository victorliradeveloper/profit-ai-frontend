<div class="category-icon-picker-modal-inner px-6 pt-6 pb-5 w-[min(560px,calc(100vw-2rem))] max-h-[min(520px,85vh)] flex flex-col">
  <div class="flex items-start justify-between gap-4 shrink-0">
    <h2 class="text-xl font-semibold text-white m-0 leading-tight">Ícone</h2>
    <button
      type="button"
      mat-icon-button
      class="text-white/70 hover:bg-white/10 -mt-1 -mr-2"
      aria-label="Fechar"
      (click)="cancel()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="category-icon-picker-grid mt-5 overflow-y-auto pr-1 -mr-1 flex-1 min-h-0">
    @for (icon of icons; track icon) {
      <button
        type="button"
        class="category-icon-picker-cell"
        [class.category-icon-picker-cell--selected]="icon === data.currentIcon"
        (click)="select(icon)"
        [attr.aria-label]="'Escolher ícone ' + icon"
        [attr.aria-pressed]="icon === data.currentIcon"
      >
        <mat-icon class="!text-[22px] !w-[22px] !h-[22px] leading-[22px]">{{ icon }}</mat-icon>
      </button>
    }
  </div>
</div>
