<app-data-table
  ariaLabel="Tabela de categorias"
  paginatorAriaLabel="Paginação da tabela de categorias"
  [columns]="columns"
  [rows]="rows"
  [filter]="filter"
  [filterKeys]="['name', 'icon', 'color']"
  [pageSize]="50"
  [pageSizeOptions]="[10, 25, 50, 100]"
>
  <ng-template appDataTableCellDef="icon" let-row>
    <mat-icon aria-hidden="true" class="!text-white/70 text-[18px] leading-[18px]">{{ row.icon }}</mat-icon>
  </ng-template>

  <ng-template appDataTableCellDef="color" let-row>
    <span aria-hidden="true" class="inline-block w-3.5 h-3.5 rounded-full" [style.background]="row.color"></span>
  </ng-template>

  <ng-template appDataTableCellDef="actions" let-row>
    <div class="flex items-center justify-start gap-1">
      <button
        type="button"
        mat-icon-button
        class="text-white/80 hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 focus-visible:ring-offset-2 focus-visible:ring-offset-[#2c2c2e] !w-8 !h-8 !p-0"
        matTooltip="Detalhes"
        (click)="onAction('details', row)"
        aria-label="Detalhes"
      >
        <mat-icon aria-hidden="true" class="text-white/70 text-[18px] leading-[18px]">description</mat-icon>
      </button>
      <button
        type="button"
        mat-icon-button
        class="text-white/80 hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 focus-visible:ring-offset-2 focus-visible:ring-offset-[#2c2c2e] !w-8 !h-8 !p-0"
        matTooltip="Editar"
        (click)="onAction('edit', row)"
        aria-label="Editar"
      >
        <mat-icon aria-hidden="true" class="text-white/70 text-[18px] leading-[18px]">edit</mat-icon>
      </button>
      <button
        type="button"
        mat-icon-button
        class="text-white/80 hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 focus-visible:ring-offset-2 focus-visible:ring-offset-[#2c2c2e] !w-8 !h-8 !p-0"
        matTooltip="Arquivar"
        (click)="onAction('archive', row)"
        aria-label="Arquivar"
      >
        <mat-icon aria-hidden="true" class="text-white/70 text-[18px] leading-[18px]">inventory_2</mat-icon>
      </button>
    </div>
  </ng-template>
</app-data-table>
